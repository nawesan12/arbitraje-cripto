services:
  redis:
    image: redis:7-alpine
    container_name: omniarb-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: omniarb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
      POSTGRES_DB: omniarb
    ports:
      - "15432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omniarb"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: omniarb-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgres://omni:omni@postgres:5432/omniarb
    volumes:
      - ./logs:/app/logs
    # La TUI requiere terminal interactiva. Para usar TUI conectate con:
    #   docker compose run --rm app
    # Para correr el bot como daemon (sin TUI), seteá HEADLESS=true en .env
    tty: true
    stdin_open: true

volumes:
  redis-data:
  pg-data:
