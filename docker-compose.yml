services:
  redis:
    image: redis:7-alpine
    container_name: omniarb-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: omniarb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
      POSTGRES_DB: omniarb
    ports:
      - "15432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omniarb"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    image: omniarbitraje-ar:latest
    container_name: omniarb-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override URLs internas (los containers se ven entre sí)
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgres://omni:omni@postgres:5432/omniarb
      # En Docker corremos headless: control 100% por Telegram bot.
      # Para TUI usar: docker compose run --rm app-tui
      HEADLESS: "true"
    volumes:
      - ./logs:/app/logs
      - ./runtime-overrides.json:/app/runtime-overrides.json

  # Servicio "one-shot" para abrir la TUI cuando lo necesites.
  # Uso: docker compose run --rm app-tui
  app-tui:
    image: omniarbitraje-ar:latest
    profiles: ["tui"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgres://omni:omni@postgres:5432/omniarb
      HEADLESS: "false"
    volumes:
      - ./logs:/app/logs
      - ./runtime-overrides.json:/app/runtime-overrides.json
    tty: true
    stdin_open: true

volumes:
  redis-data:
  pg-data:
